<!doctype html>
<html lang="en-gb"> <!-- Indicates page is written in British English for accessibility-->
<meta charset="utf-8">
<title>Azul</title>
<link rel="stylesheet" href="default.css"> <!-- Imports stylesheet-->
<script type="module" src="main.js"></script>

<header>
    <h1 id="title"><img src="./assets/azulLogo.png" alt="Azul"></h1>
</header>

<main>
    <section id="factories_area" aria-label="Factory displays and centre pool">
        <div id="factories"></div>
        <div id="centre_area">
            <h2>Centre</h2>
            <div id="centre"></div>
        </div>
    </section>
    <p id="turn_indicator" aria-live="polite"></p>
</main>

<aside id="player0_sidebar" class="sidebar" aria-label="Player 1 board">
    <div class="player_name_row">
        <input id="player0_name" aria-label="Player 1 name" value="Player 1">
        <span class="score_label">Score: <strong id="player0_score">0</strong></span>
    </div>
    <div class="board_area">
        <div class="pattern_lines" id="player0_pattern" aria-label="Player 1 pattern lines"></div>
        <div class="wall_grid" id="player0_wall" aria-label="Player 1 wall"></div>
    </div>
    <div class="floor_area">
        <h3>Floor</h3>
        <div class="floor_line" id="player0_floor" aria-label="Player 1 floor line"></div>
    </div>
</aside>

<aside id="player1_sidebar" class="sidebar" aria-label="Player 2 board">
    <div class="player_name_row">
        <input id="player1_name" aria-label="Player 2 name" value="Player 2">
        <span class="score_label">Score: <strong id="player1_score">0</strong></span>
    </div>
    <div class="board_area">
        <div class="pattern_lines" id="player1_pattern" aria-label="Player 2 pattern lines"></div>
        <div class="wall_grid" id="player1_wall" aria-label="Player 2 wall"></div>
    </div>
    <div class="floor_area">
        <h3>Floor</h3>
        <div class="floor_line" id="player1_floor" aria-label="Player 2 floor line"></div>
    </div>
</aside>

<dialog id="result_dialog" tabindex="0" aria-label="Game over">
    <div id="result_board_0" class="result_board" aria-label="Player 1 final wall"></div>
    <div class="result_content">
        <h2>Game Over</h2>
        <p id="result_message"></p>
        <p id="result_scores"></p>
        <button id="play_again_btn" autofocus>Play Again</button>
    </div>
    <div id="result_board_1" class="result_board" aria-label="Player 2 final wall"></div>
</dialog>

<div id="tooltip" aria-hidden="true"></div>
<a href="menu.html" id="menu_btn" aria-label="Back to main menu">&#8592; Menu</a>
