<!doctype html>
<html lang="en-gb">
<meta charset="utf-8">
<title>Azul – Settings</title>
<link rel="stylesheet" href="menu.css">
<script type="module" src="settings.js"></script>

<main class="content_screen">
    <a href="menu.html" class="back_btn" aria-label="Back to main menu">← Back</a>
    <h1 class="logo small">Azul</h1>

    <div class="settings_content">
        <section>
            <h2>Player Names</h2>
            <div class="setting_row">
                <label for="player0_name">Player 1</label>
                <input id="player0_name" type="text" maxlength="20" placeholder="Player 1">
            </div>
            <div class="setting_row">
                <label for="player1_name">Player 2</label>
                <input id="player1_name" type="text" maxlength="20" placeholder="Player 2">
            </div>
        </section>

        <button id="save_btn" class="menu_btn save">Save Settings</button>
        <p id="save_msg" aria-live="polite"></p>
    </div>
</main>
